services:

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    mem_limit: 50M

  db_migrate:
    build: .
    container_name: db-migrate
    env_file:
      - .env
    command: ["uv", "run", "backend/manage.py", "migrate", "--noinput"]
    mem_limit: 200m

  collect_static:
    build: .
    container_name: static-files
    environment:
      - STATIC_ROOT=/vol/static
    volumes:
      - static_volume:/vol/static
    env_file:
      - .env
    command: ["uv", "run", "backend/manage.py", "collectstatic", "--noinput"]
    mem_limit: 200m

  web1: &web_base
    container_name: skills4Hire-web1
    working_dir: /app/backend/backend
    deploy:
      resources:
        limits:
          memory: 250M
    mem_limit: 250M
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    build: .
    command: [
      "uv", "run", "daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"
    ]
    env_file:
      - .env
    environment:
      - STATIC_ROOT=/vol/static
    volumes:
      - static_volume:/vol/static
    restart: "always"
    expose:
      - "8000"

  # web2:
  #   <<: *web_base
  #   container_name: skills4Hire-web2

  # web3:
  #   <<: *web_base
  #   container_name: skills4Hire-web3

  # celery-worker:
  #   build: .
  #   container_name: celery-worker
  #   working_dir: /app/backend/backend
  #   command: ["uv", "run", "celery", "-A", "config", "worker", "--loglevel=info"]
  #   env_file:
  #     - .env
  #   restart: "unless-stopped"

  # celery-beat:
  #   build: .
  #   container_name: celery-beat
  #   restart: "unless-stopped"
  #   working_dir: /app/backend/backend
  #   env_file:
  #     - .env
  #   command: ["uv", "run", "celery", "-A", "config", "beat", "--loglevel=info"]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - static_volume:/vol/static
    depends_on:
      - web1
      # - web2
      # - web3
    restart: unless-stopped
    mem_limit: 50m

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  static_volume: