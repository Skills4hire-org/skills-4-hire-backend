map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app {
    server web1:8000 max_fails=3 fail_timeout=10s;
    server web2:8000 max_fails=3 fail_timeout=10s;
    server web3:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name theskills4hire.com www.theskills4hire.com;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /vol/static/;
        expires 30d;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name theskills4hire.com www.theskills4hire.com;

    ssl_certificate /etc/letsencrypt/live/theskills4hire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theskills4hire.com/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /vol/static/;
        expires 30d;
    }

    location /api/v1/wallet/paystack-webhook/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;

        proxy_intercept_errors on;
        error_page 502 = @fallback;
    }

    location @fallback {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}